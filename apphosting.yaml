# Firebase App Hosting — https://firebase.google.com/docs/app-hosting
#
# GitHub: https://github.com/Misaacnorman/upwork
# App root = repository root. Build installs from web/package-lock.json (no npm workspaces;
# Cloud Build was not resolving workspaces — use --prefix web).
#
# FIREBASE_WEBAPP_CONFIG is injected at build; web/vite.config.ts maps it to VITE_*.

runConfig:
  minInstances: 0
  maxInstances: 10
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm ci --prefix web && npm run build --prefix web
  runCommand: npm run start --prefix web
