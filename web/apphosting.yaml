# Firebase App Hosting — https://firebase.google.com/docs/app-hosting
#
# GitHub repo: https://github.com/Misaacnorman/upwork
# In Firebase console (App Hosting → Create backend): connect that repo and set
#   App root directory: web   (this folder)
#   Live branch: main
#
# Firebase injects FIREBASE_WEBAPP_CONFIG at build time; vite.config.ts maps it to VITE_*.
# Optional: add VITE_STRIPE_PUBLISHABLE_KEY in console → Backend → Environment (BUILD).

runConfig:
  minInstances: 0
  maxInstances: 10
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm ci && npm run build
  runCommand: npm run start
